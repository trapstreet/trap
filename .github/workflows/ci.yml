name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      - name: Docs lint (manifest + links)
        # Keeps docs/manifest.json and cross-doc links valid — the docs site renders
        # docs/ live from each release tag (see issue #19). Version match is asserted
        # in the release workflow only (no tag on a PR).
        run: uv run --no-project python scripts/lint_docs.py

      - name: Type check
        run: uv run --with pyright pyright src/

      - name: Tests (coverage must stay 100%)
        run: uv run pytest --cov
