name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Required for PyPI trusted publishing (OIDC) — no API token needed.
      id-token: write
      # Required for `gh release create` to attach a GitHub Release to the tag.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs derives the version from git tags; needs full history.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.1

      - name: Docs lint + version match
        # Fail before publishing if docs/manifest.json's cli_version doesn't match the
        # tag — the docs site displays it, so a stale value would mislabel the release.
        run: uv run --no-project python scripts/lint_docs.py --expect-version "${GITHUB_REF_NAME#v}"

      - name: Build
        run: uv build

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

      - name: GitHub Release
        # Wrap the (already-pushed) tag in a Release object so `releases/latest`
        # resolves natively — the docs site follows it. --verify-tag ensures we only
        # ever wrap an existing tag, never invent one.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag

      - name: Refresh docs site
        # Bust the docs caches so the new release's docs go live within seconds instead
        # of the ISR window. Best-effort: the endpoint 404s until it reaches production,
        # and a cache-refresh hiccup must never fail an already-published release — so
        # continue-on-error keeps a non-2xx (incl. the pre-prod 404) a visible warning,
        # not a hard failure. Token is stored in this repo's Actions secrets.
        continue-on-error: true
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.DOCS_REFRESH_TOKEN }}" \
            https://trapstreet.run/api/revalidate-docs
